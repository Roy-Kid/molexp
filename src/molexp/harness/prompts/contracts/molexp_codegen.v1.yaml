# molexp codegen contract v1 — L0 primitive surface for plan task writers.
# Source of truth for embedded prompts; keep short (must fit every call).
# Domain science APIs (molpy/molpack) come from molmcp / capability catalog.
version: "1"
kind: molexp.codegen_contract

workflow:
  imports:
    - molexp.workflow.WorkflowCompiler
    - molexp.workflow.TaskContext
    - molexp.workflow.RegisterArtifact
    - molexp.workflow.RegisterMetric
  task_module:
    # One file: workflow/<slug>.py with a single async def named <slug>
    emit: single_task_function_only
    no_emit:
      - WorkflowCompiler
      - build_workflow
      - __init__.py
      - "@wf.task decorator"
    imports_inside_function: true
  task_context:
    optional: true
    fields: [workdir]
    forbid: [inputs, config]
  dataflow:
    mode: by_parameter_name
    # Upstream return dict keys become this task's parameter names (engine).
    return: dict_of_output_keys
    rules:
      - Match bound task inputs/outputs keys exactly
      - >-
          Do not re-nest return values (e.g. nested monomer.frame)
          unless bound outputs explicitly require that shape
      - Whole objects (Frame, ForceField) pass by name — do not re-serialize
  register_metric:
    ctor: "RegisterMetric(key, value)"
    fields: [key, value, step, tags]
    forbid_attrs: [name]
  register_artifact:
    ctor: "RegisterArtifact(path, mime=?)"
    notes:
      - path under ctx.workdir
      - do not Path(RegisterArtifact) / open(RegisterArtifact)

domain:
  # Public Python surface only (molmcp must not push molrs.* for Python agents)
  frame: molpy.Frame
  block: molpy.Block
  forbid_imports: [molrs]
  resolve_via: [capability_catalog, molmcp_open]

tests:
  call_real_body: true
  mock_only_imported_symbols: true
  import_any: "from unittest.mock import ANY, patch"
  offline: true
  prefer_assert:
    - return_dict_keys
    - workdir_files_exist
    - metric_key_value

workspace_primitives:
  # Rarely needed inside task bodies; listed for completeness.
  hierarchy: [Workspace, Project, Experiment, Run]
  run_verbs: [run, resume, rerun, cancel]
  identity: config_hash_is_run_identity
  # Drive FAIR experiments from the CLI — do not re-implement a mini runner.
  drive_via: molexp_run
  declare_with: "Workspace(...).project(...).experiment(...).run(wf.compile(), params=...)"

# Anti-patterns rejected by WorkflowSourceValidator (and by reviewers).
# Science packages are installed imports; sibling modules resolve via molexp run
# (script dir is on sys.path automatically). Never hand-roll the driver.
entry_script:
  prefer:
    - "module-level Workspace → Project → Experiment → run(compiled, params=...)"
    - "task params + molcfg profiles + `molexp run --override KEY=VAL`"
    - "RegisterArtifact / RegisterMetric from task returns (pure TaskContext)"
    - "re-execute with `molexp run --rerun [--fresh]` (content-addressed run ids)"
  forbid:
    - argparse_cli  # molexp run owns the CLI
    - sys_path_insert  # install packages; molexp run adds script dir only
    - hardcoded_source_trees  # no /nobackup/.../pkg/src path hacks
    - timestamp_run_ids  # fights content-addressed identity; use --rerun
    - driver_side_run_start  # no second run.start() after execute for metrics
    - execute_run_in_entry  # FAIR entry = molexp run; execute_run is library-only
