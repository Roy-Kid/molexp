# Managed by prek: `prek install`
# Python tests: tox from pyproject[dev]. Lint uses ruff-pre-commit (tree not
# fully ruff-clean for full-tree tox -e lint yet). UI mirrors ci.yml ui job.
#
# Install: prek install

default_install_hook_types: [pre-commit, pre-push]

exclude: '^ui/src/api/generated/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml
      - id: check-json
        exclude: '(^|/)(tsconfig(\..+)?\.json|devcontainer\.json)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: tox-py
        name: "CI test (uv run --extra dev tox -e py)"
        entry: uv run --extra dev tox -e py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ui
        name: "UI lint + typecheck + test (ci.yml ui job)"
        entry: bash -c 'npm run lint && npm run typecheck && npm run test:ui'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
