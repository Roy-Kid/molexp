# Managed by prek: `prek install`
# CI parity with .github/workflows/ci.yml (UV_NO_SOURCES=1 for path-free installs).

default_install_hook_types: [pre-commit, pre-push]
exclude: '^ui/src/api/generated/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      # UV_NO_SOURCES=1 reproduces the CI resolution (published deps, no
      # `[tool.uv.sources]` path overrides). It runs in its OWN environment:
      # syncing that resolution into .venv would silently replace the editable
      # sibling checkouts (molpy / molrs) a dev is working against.
      - id: ci-test
        name: "CI test (uv sync + pytest, UV_NO_SOURCES=1)"
        entry: bash -c 'export UV_NO_SOURCES=1 UV_PROJECT_ENVIRONMENT=.venv-ci; uv sync --extra dev && uv run pytest tests/ -q --cov=src/molexp --cov-report=xml'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Mirrors the ci.yml `ui` job command for command. That job is
      # `continue-on-error` because the UI depends on @molcrafts/molplot and
      # molvis through `file:../../` paths a CI clone does not have — so this
      # hook is currently the ONLY place UI regressions are actually caught.
      # Make the CI job blocking (and drop this note) once those packages are
      # published.
      - id: ui-checks
        name: "CI ui (biome lint + tsc + vitest)"
        entry: bash -c 'npm run lint && npm run typecheck && npm run test:ui'
        language: system
        pass_filenames: false
        files: '^ui/'
        stages: [pre-push]
