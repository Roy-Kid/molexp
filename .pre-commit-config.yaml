# Managed by prek: `prek install`
# CI parity with .github/workflows/ci.yml (UV_NO_SOURCES=1 for path-free installs).

default_install_hook_types: [pre-commit, pre-push]
exclude: '^ui/src/api/generated/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: ci-test
        name: "CI test (uv sync + pytest, UV_NO_SOURCES=1)"
        entry: bash -c 'export UV_NO_SOURCES=1; uv sync --extra dev && uv run pytest tests/ -q --cov=src/molexp --cov-report=xml'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
