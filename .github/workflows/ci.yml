name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

# Keep tool pins in lockstep with .pre-commit-config.yaml (pre-commit is SoT
# for ruff rev; CI follows for pre-commit/ty install versions).
env:
  PRE_COMMIT_VERSION: "4.6.0"
  # Pin follows latest stable on PyPI at sync time; bump with pre-commit SoT.
  TY_VERSION: "0.0.60"
  # Hermetic CLI captures — same contract as tests/conftest.py.
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  CLICOLOR_FORCE: "0"
  TERM: "dumb"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install "pre-commit==${PRE_COMMIT_VERSION}" "ty==${TY_VERSION}"

      - name: Run pre-commit (mirrors .pre-commit-config.yaml default stage)
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Tests rely on newer-than-PyPI behaviour of molcrafts-molq
          # (MOLCRAFTS_HOME honoured for JobStore redirection — added in
          # 0.5.0 on master, not yet released to PyPI). Pip ignores
          # [tool.uv.sources], so install the sibling repo from git first;
          # molexp's `molcrafts-molq>=0.2.0` pin is then satisfied by it.
          # Local pre-push uses [tool.uv.sources] path = "../molq" when present.
          python -m pip install --upgrade pip
          pip install "molcrafts-molq @ git+https://github.com/MolCrafts/molq.git"
          pip install -e ".[dev]"

      - name: Run tests
        # Command string must match the pre-push `pytest` hook (flags + paths).
        run: pytest tests/ -q --cov=src/molexp --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  ui:
    name: UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json packageManager is npm@11; Node 22 ships a compatible npm.
          node-version: "22"

      - name: Install UI dependencies
        # package-lock.json is gitignored in this repo — cannot use npm ci.
        run: npm install

      - name: Lint + typecheck + test
        # Same three commands as the pre-push `ui` hook / root package.json scripts.
        run: |
          npm run lint
          npm run typecheck
          npm run test:ui
