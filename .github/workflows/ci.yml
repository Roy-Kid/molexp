name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install (no path sources — CI clone has no sibling mollog)
        env:
          UV_NO_SOURCES: "1"
        run: uv sync --extra dev
      - name: Ruff
        env:
          UV_NO_SOURCES: "1"
        run: |
          uv run ruff format --check .
          uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        env:
          UV_NO_SOURCES: "1"
        run: uv sync --extra dev
      - name: pytest
        env:
          UV_NO_SOURCES: "1"
        run: uv run pytest tests/ -q --cov=src/molexp --cov-report=xml

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # no cache: package-lock may be absent by design
      - name: npm install
        run: npm install
      - name: UI lint + typecheck + test
        run: npm run lint && npm run typecheck && npm run test:ui
        continue-on-error: true
