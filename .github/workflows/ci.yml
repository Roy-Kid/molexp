name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install prek tools + ruff
        run: uv pip install --system "ruff==0.15.12"
      - name: Ruff check / format (staged-style gate; full-tree tox lint later)
        run: |
          ruff format --check .
          ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: uv run --extra dev tox -e py
        run: uv run --extra dev tox -e py

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm install
        run: npm install
      - name: UI lint + typecheck + test
        run: npm run lint && npm run typecheck && npm run test:ui
