name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install (no path sources — CI clone has no sibling mollog)
        env:
          UV_NO_SOURCES: "1"
        run: uv sync --extra dev
      - name: Ruff + ty
        env:
          UV_NO_SOURCES: "1"
        # Mirrors mol_project.build.check and the pre-commit ruff/ty hooks.
        run: |
          uv run ruff format --check src/ tests/
          uv run ruff check src/ tests/
          uv run ty check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep in lockstep with requires-python (>=3.12) and the pre-push
          # ci-test hook (single interpreter in .venv-ci).
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        env:
          UV_NO_SOURCES: "1"
        run: uv sync --extra dev
      - name: pytest
        env:
          UV_NO_SOURCES: "1"
        # Same command as .pre-commit-config.yaml `ci-test` (pre-push).
        run: uv run pytest tests/ -q --cov=src/molexp --cov-report=xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm install
        # package-lock.json is gitignored (latest-range policy); install
        # resolves caret ranges from apps/web/package.json on every run.
        run: npm install
      - name: Web lint + typecheck + test
        # Same command as .pre-commit-config.yaml `web-checks` (pre-push).
        run: npm run lint && npm run typecheck && npm run test:web
